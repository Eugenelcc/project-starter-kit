# Creates a GitHub Release when a vX.Y.Z tag is pushed.
# Only runs in Eugenelcc/project-starter-kit: projects created from the
# template skip it. Delete this file and kit/ in your own project.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Eugenelcc/project-starter-kit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against .kit-version and main
        env:
          TAG: ${{ github.ref_name }}
          MAIN_REF: origin/main
        run: bash kit/scripts/check-release.sh
      - name: Create the release (skip if it already exists)
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
